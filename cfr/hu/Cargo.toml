[package]
name = "hu"
version = "0.1.0"
edition = "2021"
description = "The CFR engine's command line: build abstractions, train, export, evaluate, serve"

[[bin]]
name = "hu"
path = "src/main.rs"

[features]
# The box has the GPU; build with --no-default-features elsewhere.
default = ["gpu"]
gpu = ["hu_cfr/gpu"]

[dependencies]
hu_core = { path = "../hu_core" }
hu_cfr = { path = "../hu_cfr" }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
